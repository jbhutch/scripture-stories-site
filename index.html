<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scripture Stories</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Scripture Stories</h1>
    <nav class="site-nav">
      <button type="button" data-nav="random">Random</button>
      <button type="button" data-nav="browse">Browse</button>
      <button type="button" data-nav="gallery">Gallery</button>
    </nav>
  </header>

  <main>
    <section id="view-random" class="view">
      <div id="random-category-filter" class="category-filter"></div>
      <div class="random-stack">
        <button type="button" class="primary-btn random-btn random-btn-top">Surprise me</button>
        <div id="random-result" class="result"></div>
        <button type="button" class="primary-btn random-btn random-btn-bottom">Surprise me</button>
      </div>
    </section>

    <section id="view-browse" class="view" hidden>
      <div id="browse-sections" class="section-grid"></div>
      <div id="browse-section-view" hidden>
        <a class="browse-back" href="#browse">← All sections</a>
        <h2 id="browse-section-title"></h2>
        <div id="browse-results" class="story-grid"></div>
      </div>
    </section>

    <section id="view-gallery" class="view" hidden>
      <div id="gallery-grid" class="story-grid"></div>
      <button id="gallery-load-more" class="primary-btn" hidden>Load more</button>
    </section>
  </main>

  <div id="story-modal" class="modal-overlay" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-content">
      <button type="button" class="modal-close" data-close>× Close</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
